services:
  go:
    build:
      context: ./go
      dockerfile: Dockerfile
    container_name: myapp-go
    volumes:
      - ./go:/app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=myapp
      - GO_ENV=development
      - AI_ENGINE=ollama
      - OLLAMA_ENDPOINT=http://ollama:11434
      - OLLAMA_MODEL=llama2
    depends_on:
      - mysql

  mysql:
    build:
      context: ./docker/mysql
    container_name: myapp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: myapp
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

  ollama:
    build:
      context: ./docker/ollama
      dockerfile: Dockerfile
    container_name: myapp-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # ダウンロードするモデル（スペース区切り）
      - OLLAMA_MODELS=mistral llama2
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ai
    # GPU サポートが必要な場合はコメント解除
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  mysql_data:
  ollama_data:
